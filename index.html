<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande de rendez-vous à la belle Mélissa Sagne</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #ffeef5;
    padding: 20px;
}

.formulaire {
    background: white;
    padding: 25px;
    border-radius: 15px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 0 10px #ccc;
}

h1 {
    text-align: center;
    color: #d63384;
}

.question {
    margin-top: 20px;
    font-size: 18px;
}

label {
    display: block;
    margin: 10px 0;
    font-size: 16px;
}

input {
    transform: scale(1.3);
    margin-right: 10px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #d63384;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
}
</style>

</head>

<body>

<div class="formulaire">

<h1>Demande de rendez-vous à la belle Mélissa Sagne ❤️</h1>

<div class="question">
<p>1) Onesime a-t-il quelqu’un que vous appréciez particulièrement ?</p>

<label>
<input type="radio" name="q1"> Oui
</label>

<label>
<input type="radio" name="q1"> Non
</label>
</div>


<div class="question">
<p>2) Onesime serait-il un bon choix pour vous ?</p>

<label>
<input type="radio" name="q2"> Oui
</label>

<label>
<input type="radio" name="q2"> Non
</label>
</div>


<div class="question">
<p>3) Accepteriez-vous un rendez-vous avec lui ?</p>

<label>
<input type="radio" name="q3"> Oui ❤️
</label>

<label>
<input type="radio" name="q3"> Non
</label>
</div>


<div class="question">
<p><strong>Date proposée :</strong> 1 août 2026</p>
</div>


<div class="question">
<p><strong>Choisissez l'heure du rendez-vous :</strong></p>

<label>
<input type="radio" name="heure"> 17h
</label>

<label>
<input type="radio" name="heure"> 18h
</label>

<label>
<input type="radio" name="heure"> 20h
</label>

</div>


<button>
Envoyer ma réponse 💌
</button>

</div>

</body>
</html>
